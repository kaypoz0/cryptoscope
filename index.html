<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoScope — Financial Destiny</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #062a32;
      --sea: #0b4a56;
      --tide: #146f78;
      --foam: #d7efea;
      --mist: #eef7f4;
      --accent: #0f6b5c;
      --accent-deep: #0a4f44;
      --shark: #0d4a46;
      --line: rgba(6, 42, 50, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(20, 111, 120, 0.18), transparent 60%),
        radial-gradient(900px 500px at 10% 20%, rgba(15, 107, 92, 0.12), transparent 55%),
        linear-gradient(180deg, #f4fbf9 0%, var(--mist) 45%, #e5f2ee 100%);
      min-height: 100vh;
    }

    .page {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 4rem;
    }

    /* —— Hero —— */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: min(78vh, 640px);
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(238, 247, 244, 0.92) 0%, rgba(215, 239, 234, 0.75) 48%, rgba(180, 220, 214, 0.55) 100%),
        linear-gradient(180deg, #eaf6f3, #cfe8e2);
      box-shadow: inset 0 0 0 1px rgba(6, 42, 50, 0.06);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      cursor: crosshair;
      animation: heroIn 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(16px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      padding: clamp(2rem, 5vw, 4rem);
      max-width: 34rem;
      animation: copyIn 1000ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes copyIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(2.75rem, 7vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0 0 1rem;
    }

    .lede {
      margin: 0 0 1.75rem;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.45;
      color: var(--sea);
      font-weight: 500;
      max-width: 28ch;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--accent);
      color: #f4fffc;
      box-shadow: 0 10px 24px rgba(15, 107, 92, 0.25);
    }
    .btn-primary:hover { background: var(--accent-deep); }

    .btn-ghost {
      background: transparent;
      color: var(--sea);
      box-shadow: inset 0 0 0 1.5px rgba(11, 74, 86, 0.25);
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.45); }

    .hint {
      margin: 1rem 0 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(11, 74, 86, 0.55);
    }

    .shark-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 28%, #000 52%, #000 100%);
      mask-image: linear-gradient(90deg, transparent 0%, transparent 28%, #000 52%, #000 100%);
    }

    .hero-copy { cursor: default; }

    .shark {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(9px, 1.05vw, 12px);
      line-height: 1.08;
      letter-spacing: 0.02em;
      color: var(--shark);
      white-space: pre;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
      text-shadow: 0 0 18px rgba(26, 92, 88, 0.15);
      transition: color 200ms ease;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -30% 40%;
      height: 70%;
      background: radial-gradient(ellipse at center, rgba(20, 111, 120, 0.22), transparent 65%);
      z-index: 0;
      pointer-events: none;
      animation: tide 8s ease-in-out infinite alternate;
    }

    @keyframes tide {
      from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.7; }
      to { transform: translate3d(-4%, -3%, 0) scale(1.08); opacity: 1; }
    }

    /* —— Reading section —— */
    .reading {
      margin-top: 2.5rem;
      display: grid;
      gap: 1.25rem;
      max-width: 420px;
    }

    .reading h2 {
      font-family: "Syne", sans-serif;
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .reading p.sub {
      margin: 0;
      color: var(--sea);
      font-size: 0.95rem;
    }

    .panel {
      display: grid;
      gap: 0.75rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--sea);
    }

    select {
      width: 100%;
      font: inherit;
      padding: 0.8rem 0.9rem;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      outline: none;
    }
    select:focus {
      border-color: var(--tide);
      box-shadow: 0 0 0 3px rgba(20, 111, 120, 0.15);
    }

    #output {
      min-height: 1.5rem;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--ink);
    }
    #output .token { color: var(--accent-deep); font-weight: 600; }
    #output .mood { color: #8a3a2a; font-weight: 600; }
    #output .muted { color: var(--sea); font-style: italic; }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: 70vh;
      }
      .hero-copy {
        padding-bottom: 1rem;
        max-width: none;
      }
      .shark-field {
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 38%, #000 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 38%, #000 100%);
      }
      .lede { max-width: 34ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero, .hero-copy, .hero::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="CryptoScope hero">
      <div class="hero-copy">
        <h1 class="brand">CryptoScope</h1>
        <p class="lede">Your daily dose of crypto-financial destiny — charted in the stars, guarded by fish.</p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#reading">Reveal my destiny</a>
          <button class="btn btn-ghost" type="button" id="spook-sharks">Spook the fish</button>
        </div>
        <p class="hint">Move your cursor — they scatter</p>
      </div>
      <div id="shark-field" class="shark-field" aria-hidden="true"></div>
    </section>

    <section class="reading" id="reading">
      <h2>Read the charts</h2>
      <p class="sub">Pick a sign. We’ll remix the cosmos with on-chain superstition.</p>

      <div class="panel">
        <label for="sign">Zodiac sign</label>
        <select id="sign">
          <option>Aquarius</option>
          <option>Pisces</option>
          <option>Aries</option>
          <option>Taurus</option>
          <option>Gemini</option>
          <option>Cancer</option>
          <option>Leo</option>
          <option>Virgo</option>
          <option>Libra</option>
          <option>Scorpio</option>
          <option>Sagittarius</option>
          <option>Capricorn</option>
        </select>
        <button class="btn btn-primary" type="button" onclick="getFortune()">Reveal my financial destiny</button>
        <div id="output"></div>
      </div>
    </section>
  </main>

  <script src="sharks.js"></script>
  <script>
    const cryptoPhrases = [
      "It's time to stake your soul to the blockchain.",
      "WAGMI... or are we?",
      "Your wallet cries in ERC-20 fees.",
      "The stars suggest a rug pull... stay cautious.",
      "Mercury retrograde signals a bullish trap."
    ];
    const tokens = ["$DOGE", "$SHIB", "$SOL", "$ETH", "$APE", "$RUG"];
    const advice = [
      "Convert everything to stablecoins and meditate.",
      "Invest in JPEGs, the rarer the better.",
      "YOLO into that microcap gem.",
      "HODL till the next halving.",
      "Sacrifice some $ETH to appease the DeFi gods."
    ];

    async function getFortune() {
      const sign = document.getElementById("sign").value.toLowerCase();
      const output = document.getElementById("output");
      output.textContent = "Consulting the order books…";
      try {
        const res = await fetch(`/.netlify/functions/horoscope?sign=${sign}`);
        const data = await res.json();
        const randomPhrase = cryptoPhrases[Math.floor(Math.random() * cryptoPhrases.length)];
        const randomToken = tokens[Math.floor(Math.random() * tokens.length)];
        const randomAdvice = advice[Math.floor(Math.random() * advice.length)];
        output.innerHTML = `
          <p><strong>${sign.charAt(0).toUpperCase() + sign.slice(1)}</strong></p>
          <p>${data.description || "The charts are cloudy today."}</p>
          <p class="muted">${randomPhrase}</p>
          <p>Lucky token: <span class="token">${randomToken}</span></p>
          <p>Outlook: <span class="mood">${data.mood || "volatile"}</span></p>
          <p>Advice: ${randomAdvice}</p>
        `;
      } catch (err) {
        output.innerHTML = '<p class="mood">Failed to fetch destiny. Try again later.</p>';
      }
    }

    document.getElementById("spook-sharks")?.addEventListener("click", () => {
      window.spookSharks?.();
    });
  </script>
</body>
</html>
